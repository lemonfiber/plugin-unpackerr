[package]
name = "unpackerr-adapter"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/plugin-unpackerr"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "Speaks lemonfiber's archive.extract contract in front of Unpackerr, through the configuration it reads and the events it posts"
publish = false

[[bin]]
name = "unpackerr-adapter"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
getrandom = "0.4"
hex = "0.4"
sha2 = "0.11"
async-trait = "0.1"
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "d5dc170c382d2c7cb542c0f8d6e3fe186ef270c6" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "d5dc170c382d2c7cb542c0f8d6e3fe186ef270c6" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "d5dc170c382d2c7cb542c0f8d6e3fe186ef270c6" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
lemonfiber-fixtures = { git = "https://github.com/lemonfiber/lemonfiber", rev = "d5dc170c382d2c7cb542c0f8d6e3fe186ef270c6" }
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
lemonfiber-plugin = { git = "https://github.com/lemonfiber/lemonfiber", rev = "d5dc170c382d2c7cb542c0f8d6e3fe186ef270c6" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
